[package]
name = "observatory-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
observatory-spec = { path = "../crates/observatory-spec" }
observatory-wasm = { path = "../crates/observatory-wasm" }

[[bin]]
name = "spec_parse"
path = "fuzz_targets/spec_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wasm_inspect"
path = "fuzz_targets/wasm_inspect.rs"
test = false
doc = false
bench = false

[workspace]
